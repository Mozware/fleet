apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-project-dev
spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              field.cattle.io/projectId: p-vg4vf

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              field.cattle.io/projectId: p-vg4vf
