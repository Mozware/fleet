
{{- range .Values.namespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-project-dev
  namespace: {{ . }}
spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          field.cattle.io/projectId: {{ $.Values.projectId }}

  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          field.cattle.io/projectId: {{ $.Values.projectId }}
---
{{- end }}
